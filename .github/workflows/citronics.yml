name: citronics

# Every push to main builds the Fairphone 2 and 3 boot images and publishes
# them as a release named after the U-Boot version. Pull requests only build.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: citronics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Pinned to the LTS the Citronics Ubuntu images target.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          # The version string comes from git describe: it needs the tags
          fetch-depth: 0
          filter: blob:none

      - name: Fetch the upstream version tags
        run: |
          git fetch --no-tags --filter=blob:none https://github.com/u-boot/u-boot.git \
            'refs/tags/v20*:refs/tags/v20*'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-arm-linux-gnueabihf gcc-aarch64-linux-gnu \
            bison flex bc python3 python3-dev python3-setuptools \
            python3-pyelftools swig libssl-dev libgnutls28-dev uuid-dev xxd

      - name: Build
        run: |
          citronics/build.sh
          cd build-citronics
          sha256sum u-boot-fp2.img u-boot-fp3.img > SHA256SUMS
          cat SHA256SUMS
          # e.g. 2027.01-rc2-00123-g0123456789ab
          echo "VERSION=$(make -s -C build-fp2 ubootrelease)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: u-boot-${{ env.VERSION }}
          path: |
            build-citronics/u-boot-*.img
            build-citronics/SHA256SUMS

      - name: Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="citronics-$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released"
            exit 0
          fi
          cat > notes.md <<EOF
          U-Boot $VERSION for the Fairphone 2 and the Fairphone 3 / 3+, built from $GITHUB_SHA.

          | Phone | Image |
          |---|---|
          | Fairphone 2 | \`u-boot-fp2.img\` |
          | Fairphone 3 / 3+ | \`u-boot-fp3.img\` |

          The bootloader must be unlocked. Hold Volume Down while powering on to
          reach the stock LK fastboot, try U-Boot from RAM, then install it:

              fastboot boot u-boot-fp3.img
              fastboot flash boot u-boot-fp3.img

          The Fairphone 3 also needs an empty overlay in its dtbo partition.
          Once U-Boot runs, its own fastboot updates it too
          (\`fastboot flash boot u-boot-fp2.img\`). Check the download with
          \`sha256sum -c SHA256SUMS\`. Details: citronics/README.md and
          doc/board/qualcomm/fairphone-fp2.rst, fairphone-fp3.rst.
          EOF
          gh release create "$tag" --target "$GITHUB_SHA" --title "U-Boot $VERSION" \
            --notes-file notes.md --latest \
            build-citronics/u-boot-fp2.img build-citronics/u-boot-fp3.img \
            build-citronics/SHA256SUMS
